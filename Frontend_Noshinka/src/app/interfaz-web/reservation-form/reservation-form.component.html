<section id="Reservation" class="bg-black py-24 px-6">
    <div class="max-w-4xl mx-auto">

        <div class="text-center mb-12">
            <span class="text-[#c15a2e] uppercase tracking-[0.4em] text-[10px] font-bold">
                {{ textos[currentLang].tag }}
            </span>
            <h2 class="text-white text-4xl md:text-5xl font-serif mt-4 mb-6">
                {{ textos[currentLang].title }}
            </h2>
            <p class="text-gray-400 text-sm max-w-lg mx-auto leading-relaxed">
                {{ textos[currentLang].desc }}
            </p>
        </div>

        <div class="bg-[#0a0a0a] p-8 md:p-12 border border-white/5">
            <form class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-10">

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">
                        {{ textos[currentLang].labelName }}
                    </label>
                    <input type="text" [placeholder]="textos[currentLang].placeName"
                        class="bg-transparent text-white text-sm outline-none placeholder:text-gray-700">
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">
                        {{ textos[currentLang].labelEmail }}
                    </label>
                    <input type="email" [placeholder]="textos[currentLang].placeEmail"
                        class="bg-transparent text-white text-sm outline-none placeholder:text-gray-700">
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">
                        {{ textos[currentLang].labelDate }}
                    </label>
                    <input type="date" class="bg-transparent text-white text-sm outline-none [color-scheme:dark]">
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">
                        {{ textos[currentLang].labelTime }}
                    </label>
                    <select class="bg-transparent text-white text-sm outline-none cursor-pointer">
                        <option class="bg-black">{{ textos[currentLang].selectTime }}</option>
                        <option class="bg-black">19:00</option>
                        <option class="bg-black">20:30</option>
                        <option class="bg-black">22:00</option>
                    </select>
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">
                        {{ textos[currentLang].labelGuests }}
                    </label>
                    <select class="bg-transparent text-white text-sm outline-none cursor-pointer">
                        <option class="bg-black">2 {{ textos[currentLang].guestsNum }}</option>
                        <option class="bg-black">4 {{ textos[currentLang].guestsNum }}</option>
                        <option class="bg-black">6 {{ textos[currentLang].guestsNum }}</option>
                    </select>
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">
                        {{ textos[currentLang].labelPhone }}
                    </label>
                    <input type="tel" [placeholder]="textos[currentLang].placePhone"
                        class="bg-transparent text-white text-sm outline-none placeholder:text-gray-700">
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit"
                        class="w-full bg-[#c15a2e] text-white uppercase tracking-[0.2em] text-[11px] font-bold py-4 hover:bg-[#a84d26] transition-all duration-300">
                        {{ textos[currentLang].btn }}
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-gray-500 text-[15px] mt-8">
            {{ textos[currentLang].footer }} <span class="text-[#c15a2e]">(555) 123-4567</span>
        </p>
    </div>
</section>
