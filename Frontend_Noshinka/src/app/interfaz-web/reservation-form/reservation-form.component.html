<section id="Reservation" class="bg-black py-24 px-6">
    <div class="max-w-4xl mx-auto">

        <div class="text-center mb-12">
            <span class="text-[#c15a2e] uppercase tracking-[0.4em] text-[10px] font-bold">Join Us</span>
            <h2 class="text-white text-4xl md:text-5xl font-serif mt-4 mb-6">Make a Reservation</h2>
            <p class="text-gray-400 text-sm max-w-lg mx-auto leading-relaxed">
                Experience the art of Nikkei cuisine in our intimate dining room. Reserve your table for an
                unforgettable evening.
            </p>
        </div>

        <div class="bg-[#0a0a0a] p-8 md:p-12 border border-white/5">
            <form class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-10">

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">Name</label>
                    <input type="text" placeholder="Your full name"
                        class="bg-transparent text-white text-sm outline-none placeholder:text-gray-700">
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">Email</label>
                    <input type="email" placeholder="your@email.com"
                        class="bg-transparent text-white text-sm outline-none placeholder:text-gray-700">
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">Date</label>
                    <input type="date" class="bg-transparent text-white text-sm outline-none [color-scheme:dark]">
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">Time</label>
                    <select class="bg-transparent text-white text-sm outline-none cursor-pointer">
                        <option class="bg-black">Select a time</option>
                        <option class="bg-black">19:00</option>
                        <option class="bg-black">20:30</option>
                        <option class="bg-black">22:00</option>
                    </select>
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">Guests</label>
                    <select class="bg-transparent text-white text-sm outline-none cursor-pointer">
                        <option class="bg-black">2 Guests</option>
                        <option class="bg-black">4 Guests</option>
                        <option class="bg-black">6 Guests</option>
                    </select>
                </div>

                <div
                    class="flex flex-col border-b border-white/10 pb-2 focus-within:border-[#c15a2e] transition-colors">
                    <label class="text-gray-500 uppercase text-[10px] tracking-widest mb-2 font-bold">Phone</label>
                    <input type="tel" placeholder="+1 (555) 000-0000"
                        class="bg-transparent text-white text-sm outline-none placeholder:text-gray-700">
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit"
                        class="w-full bg-[#c15a2e] text-white uppercase tracking-[0.2em] text-[11px] font-bold py-4 hover:bg-[#a84d26] transition-all duration-300">
                        Confirm Reservation
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-gray-500 text-[11px] mt-8">
            For parties larger than 6, please call us directly at <span class="text-[#c15a2e]">(555) 123-4567</span>
        </p>
    </div>
</section>
